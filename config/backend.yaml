document:
  pdf_engine: pymupdf

chunking:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 64

embedding:
  # DashScope OpenAI-compatible text embedding endpoint. Keep the workspace
  # host and API key in environment variables; never commit them here.
  provider: dashscope
  # Verified against the configured DashScope account. The previous
  # text-embedding-v4 free-tier quota is exhausted for this account.
  model_name: qwen3.7-text-embedding
  batch_size: 20
  normalize_embeddings: true
  api_base: null
  api_base_env: DASHSCOPE_API_BASE
  api_key_env: DASHSCOPE_API_KEY
  timeout_seconds: 60

vector_store:
  type: chroma
  persist_directory: data/indexes/chroma
  collection_name: cowork_documents
  faiss_num_threads: 1

retrieval:
  vector_top_k: 20
  bm25_top_k: 20
  final_top_k: 5
  enable_bm25: true
  enable_rrf: true
  rrf_k: 60
  enable_reranker: true
  # Online reranking avoids a one-time 1GB+ local CrossEncoder download.
  reranker_provider: dashscope
  reranker_model_name: qwen3.7-text-rerank
  reranker_top_n: 20
  reranker_batch_size: 16
  reranker_api_base: null
  reranker_api_base_env: DASHSCOPE_API_BASE
  reranker_api_key_env: DASHSCOPE_API_KEY
  reranker_timeout_seconds: 30

rag:
  provider: openai_compatible
  model_name: deepseek-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 60
  max_context_chars: 6000
  max_output_tokens: 512
  temperature: 0.2
  top_p: 0.9
  top_k: null
  low_relevance_threshold: 0.2
  low_relevance_score_source: vector
  allow_llm_fallback: true

cache:
  enabled: true
  similarity_threshold: 0.95
  max_entries: 256
