document:
  pdf_engine: pymupdf

chunking:
  strategy: recursive
  chunk_size: 512
  chunk_overlap: 64

embedding:
  provider: local
  model_name: bge-large-zh
  batch_size: 32
  normalize_embeddings: true

vector_store:
  type: chroma
  persist_directory: data/indexes/chroma
  collection_name: cowork_documents
  faiss_num_threads: 1

retrieval:
  vector_top_k: 20
  bm25_top_k: 20
  final_top_k: 5
  enable_bm25: true
  enable_rrf: true
  rrf_k: 60
  enable_reranker: true
  reranker_model_name: bge-reranker-base
  reranker_top_n: 20
  reranker_batch_size: 16

rag:
  provider: openai_compatible
  model_name: gpt-4o-mini
  api_base: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  timeout_seconds: 60
  max_context_chars: 6000
  max_output_tokens: 512
  temperature: 0.2
  top_p: 0.9
  top_k: null
  low_relevance_threshold: 0.2
  allow_llm_fallback: true

cache:
  enabled: true
  similarity_threshold: 0.95
  max_entries: 256
